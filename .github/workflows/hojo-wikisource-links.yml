name: Hojo Wikisource link navigation
on:
  pull_request:
    paths:
      - 'prototype/hojo-godaiki/**'
      - '.github/workflows/hojo-wikisource-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-link-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify actual Wikisource section navigation (5 clicks)
        run: node prototype/hojo-godaiki/verify_source_navigation.cjs

